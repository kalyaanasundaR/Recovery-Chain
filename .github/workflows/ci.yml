name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recoverchain_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Alembic upgrade from an empty Postgres
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/recoverchain_test
        run: |
          export PYTHONPATH=.
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Alembic upgrade from an empty SQLite
        run: |
          export PYTHONPATH=.
          DATABASE_URL=sqlite:///./_ci.db alembic upgrade head
      - name: Pytest
        run: |
          export PYTHONPATH=.
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
